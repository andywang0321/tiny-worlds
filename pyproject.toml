[project]
name = "tiny-worlds"
version = "0.1.0"
description = "Small, physical world-modeling datasets"
readme = "README.md"
authors = [{ name = "Andy Wang", email = "andywang0321@gmail.com" }]
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
friction-mnist = [
    "numpy>=2.5.4",
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py313"
line-length = 120
